<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Chip Picker Preview</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f5f5; padding: 24px; color: #444; }
  .card { background: #fff; border-radius: 12px; padding: 24px; max-width: 1100px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .header-icon { width: 40px; height: 40px; background: rgba(177, 143, 93, 0.12); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #b18f5d; font-size: 20px; }
  .header h6 { margin: 0; font-size: 16px; }
  .header small { color: #888; }
  .template-chip-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .template-chip { flex: 1 1 calc(33.333% - 12px); min-width: 220px; border: 1.5px solid #e0e0e0; border-radius: 10px; padding: 12px 14px; cursor: pointer; background: #fff; transition: border-color .15s, box-shadow .15s, background .15s; position: relative; }
  .template-chip:hover { border-color: #b18f5d; background: #faf6f0; }
  .template-chip.is-selected { border-color: #b18f5d; background: #f4ead8; box-shadow: 0 0 0 3px rgba(177,143,93,0.18); }
  .template-chip-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .template-chip-name { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .template-chip-scope { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: rgba(177,143,93,0.12); color: #b18f5d; white-space: nowrap; }
  .template-chip-direction { font-size: 12px; color: #888; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
  .template-chip-metrics { display: flex; flex-wrap: wrap; gap: 6px; }
  .template-chip-metric { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: #f5f5f5; }
  .template-chip-metric .label { color: #888; margin-inline-end: 4px; }
  .template-chip-check { position: absolute; top: 8px; inset-inline-start: 8px; width: 20px; height: 20px; border-radius: 50%; background: #b18f5d; color: #fff; display: none; align-items: center; justify-content: center; font-size: 12px; }
  .template-chip.is-selected .template-chip-check { display: flex; }
  .more-link { display: inline-block; margin-top: 12px; color: #b18f5d; cursor: pointer; font-size: 13px; }
  .extra-select { display: none; margin-top: 8px; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
  .form-preview { margin-top: 24px; padding: 16px; background: #fafafa; border-radius: 8px; font-size: 13px; }
  .form-preview .row { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
  .form-preview .field { flex: 1; min-width: 140px; }
  .form-preview .field label { display: block; color: #888; font-size: 11px; margin-bottom: 4px; }
  .form-preview .field span { font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="header-icon">▦</div>
      <div><h6>تطبيق قالب خطة</h6><small>اختر قالب لتعبئة البيانات تلقائياً (اختياري)</small></div>
    </div>

    <div class="template-chip-row" id="chipRow">
      <div class="template-chip" data-id="1" data-dir="1" data-mem="2" data-rev="4" data-side="2">
        <div class="template-chip-check">✓</div>
        <div class="template-chip-header">
          <span class="template-chip-name">قالب الحفظ المكثف</span>
          <span class="template-chip-scope">عام</span>
        </div>
        <div class="template-chip-direction">⇠ من أول المصحف</div>
        <div class="template-chip-metrics">
          <span class="template-chip-metric"><span class="label">حفظ</span>2</span>
          <span class="template-chip-metric"><span class="label">مراجعة</span>4</span>
          <span class="template-chip-metric"><span class="label">جنب</span>2</span>
        </div>
      </div>
      <div class="template-chip" data-id="2" data-dir="2" data-mem="0" data-rev="5" data-side="0">
        <div class="template-chip-check">✓</div>
        <div class="template-chip-header">
          <span class="template-chip-name">قالب مراجعة فقط</span>
          <span class="template-chip-scope">خاص</span>
        </div>
        <div class="template-chip-direction">⇢ من آخر المصحف</div>
        <div class="template-chip-metrics">
          <span class="template-chip-metric"><span class="label">مراجعة</span>5</span>
        </div>
      </div>
      <div class="template-chip" data-id="3" data-dir="1" data-mem="1.5" data-rev="2" data-side="1">
        <div class="template-chip-check">✓</div>
        <div class="template-chip-header">
          <span class="template-chip-name">قالب متوازن</span>
          <span class="template-chip-scope">عام</span>
        </div>
        <div class="template-chip-direction">⇠ من أول المصحف</div>
        <div class="template-chip-metrics">
          <span class="template-chip-metric"><span class="label">حفظ</span>1.5</span>
          <span class="template-chip-metric"><span class="label">مراجعة</span>2</span>
          <span class="template-chip-metric"><span class="label">جنب</span>1</span>
        </div>
      </div>
    </div>

    <a class="more-link" id="moreLink">▾ عرض المزيد (2)</a>
    <select class="extra-select" id="extra">
      <option value="">-- اختر قالباً آخر --</option>
      <option value="4" data-dir="1" data-mem="3" data-rev="6" data-side="2">قالب الإجازة (عام)</option>
      <option value="5" data-dir="2" data-mem="0.5" data-rev="3" data-side="0">قالب المبتدئين (خاص)</option>
    </select>

    <div class="form-preview" id="preview">
      <strong>قيم تعبئة النموذج (تتغير عند اختيار قالب):</strong>
      <div class="row">
        <div class="field"><label>اتجاه الحفظ</label><span id="p-dir">—</span></div>
        <div class="field"><label>الحفظ اليومي</label><span id="p-mem">0</span></div>
        <div class="field"><label>المراجعة</label><span id="p-rev">0</span></div>
        <div class="field"><label>جنب الدرس</label><span id="p-side">0</span></div>
      </div>
    </div>
  </div>

  <script>
    function apply(el) {
      const dir = el.dataset.dir;
      document.getElementById('p-dir').textContent = dir === '1' ? 'من أول المصحف' : dir === '2' ? 'من آخر المصحف' : '—';
      document.getElementById('p-mem').textContent = el.dataset.mem || '0';
      document.getElementById('p-rev').textContent = el.dataset.rev || '0';
      document.getElementById('p-side').textContent = el.dataset.side || '0';
    }
    document.querySelectorAll('.template-chip').forEach(c => c.addEventListener('click', () => {
      document.querySelectorAll('.template-chip').forEach(x => x.classList.remove('is-selected'));
      document.getElementById('extra').value = '';
      c.classList.add('is-selected');
      apply(c);
    }));
    document.getElementById('moreLink').addEventListener('click', e => {
      e.preventDefault();
      const s = document.getElementById('extra');
      s.style.display = s.style.display === 'block' ? 'none' : 'block';
    });
    document.getElementById('extra').addEventListener('change', e => {
      const opt = e.target.selectedOptions[0];
      if (!opt.value) return;
      document.querySelectorAll('.template-chip').forEach(x => x.classList.remove('is-selected'));
      apply(opt);
    });
  </script>
</body>
</html>
